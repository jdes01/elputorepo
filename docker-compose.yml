services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: padel
    ports:
      - '5433:5432'
  mongo:
    image: mongo:8.0
    ports:
      - '27017:27017'
  redis:
    image: redis:7.4-alpine
    ports:
      - '6379:6379'
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '1025:1025'
      - '8025:8025'
