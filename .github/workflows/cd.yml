# Al llegar a main, construye las imagenes y las publica en GHCR, etiquetadas con
# el sha del commit. No espera a CI: a main solo llega lo que ya paso por un PR
# verde (se exige en la proteccion de la rama).
name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lo unico que hace falta para escribir en ghcr.io con el GITHUB_TOKEN.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Calcula el nombre (en minusculas, como exige GHCR), el tag con el sha
      # completo y las etiquetas OCI (revision, fuente).
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/padel-${{ matrix.app }}
          tags: type=sha,prefix=,format=long
      - uses: docker/build-push-action@v6
        with:
          # La raiz del repo: los Dockerfiles necesitan el lockfile y contracts.
          context: .
          file: apps/padel/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # La misma cache que el job `images` de CI.
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
