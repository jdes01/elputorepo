# Las herramientas del host, fijadas. `mise install` las instala.
#
# La version de pnpm es el campo "packageManager" de package.json (el que lee
# corepack): mise la saca de ahi, asi que subirla es una sola edicion.

[settings]
idiomatic_version_file_enable_tools = ["pnpm"]

[tools]
node = "26.12.0"
