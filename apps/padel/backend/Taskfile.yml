# Tareas del backend. Este fichero solo sabe de si mismo: lo que cruza paquetes
# vive en el Taskfile de la raiz.
version: '3'

tasks:
  dev:
    desc: El backend en watch
    cmds: [node_modules/.bin/nest start --watch --builder swc]

  build:
    desc: Compila a dist/ (nest + swc; el typecheck va aparte)
    sources: [src/**/*.ts, .swcrc, tsconfig.build.json, nest-cli.json]
    generates: [dist/**/*]
    cmds: [node_modules/.bin/nest build --builder swc]

  start:
    desc: Arranca lo ya compilado
    cmds: [node dist/src/main.js]

  test:e2e:
    desc: e2e de API contra la app compilada y un postgres de usar y tirar (necesita docker)
    deps: [build]
    cmds: [node_modules/.bin/vitest run --config vitest.e2e.config.mts]

  typecheck: { cmds: [node_modules/.bin/tsc -p tsconfig.json] }
  lint: { cmds: [node_modules/.bin/oxlint -c ../../../configs/oxlintrc.json --deny-warnings .] }
  format: { cmds: [node_modules/.bin/oxfmt -c ../../../configs/oxfmtrc.json .] }
  format:check: { cmds: [node_modules/.bin/oxfmt -c ../../../configs/oxfmtrc.json --check .] }
