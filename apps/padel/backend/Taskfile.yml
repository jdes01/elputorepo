# Tareas del backend. Este fichero solo sabe de si mismo: lo que cruza paquetes
# vive en el Taskfile de la raiz.
version: '3'

# La BD y el correo del docker-compose.yml, vistos desde el host. Literal a proposito: en
# local siempre vale lo mismo y no es un secreto.
env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5433/padel
  SMTP_URL: smtp://localhost:1025

tasks:
  dev:
    desc: El backend en watch
    cmds: [node_modules/.bin/nest start --watch --builder swc]

  build:
    desc: Compila a dist/ (nest + swc; el typecheck va aparte)
    sources: [src/**/*.ts, .swcrc, tsconfig.build.json, nest-cli.json]
    generates: [dist/**/*]
    cmds: [node_modules/.bin/nest build --builder swc]

  start:
    desc: Arranca lo ya compilado
    cmds: [node dist/src/main.js]

  test:unit:
    desc: Unitarios (sin BD ni red)
    cmds: [node_modules/.bin/vitest run --config vitest.config.mts]

  test:http:
    desc: Los controllers por HTTP, con la app en memoria (sin docker)
    cmds: [node_modules/.bin/vitest run --config vitest.http.config.mts]

  test:integration:
    desc: Repositorios contra un postgres de usar y tirar (necesita docker)
    cmds: [node_modules/.bin/vitest run --config vitest.integration.config.mts]

  test:e2e:
    desc: e2e de API contra la app compilada y un postgres de usar y tirar (necesita docker)
    deps: [build]
    cmds: [node_modules/.bin/vitest run --config vitest.e2e.config.mts]

  migration:generate:
    desc: 'Genera la migracion del diff entre src/schema.ts y la ultima. Ej: task backend:migration:generate -- --name add-x'
    cmds: ['node_modules/.bin/drizzle-kit generate {{.CLI_ARGS}}']

  migrate:
    desc: Aplica las migraciones pendientes a la BD local
    cmds: [node_modules/.bin/drizzle-kit migrate]

  typecheck: { cmds: [node_modules/.bin/tsc -p tsconfig.json] }
  lint: { cmds: [node_modules/.bin/oxlint -c ../../../configs/oxlintrc.json --deny-warnings .] }
  format: { cmds: [node_modules/.bin/oxfmt -c ../../../configs/oxfmtrc.json .] }
  format:check: { cmds: [node_modules/.bin/oxfmt -c ../../../configs/oxfmtrc.json --check .] }
